---
deployment:
  tasks:
    # DEPLOYPATH = document root of ck.deskpulse.click. Verify in cPanel > Domains.
    - export DEPLOYPATH="$HOME/ck.deskpulse.click"
    - export PHP="$(command -v /opt/cpanel/ea-php83/root/usr/bin/php || command -v php)"
    - export COMPOSER="$(command -v /opt/cpanel/composer/bin/composer || command -v composer)"
    - /bin/mkdir -p "$DEPLOYPATH"
    - /usr/bin/rsync -a --exclude='.git' --exclude='.env' --exclude='node_modules' --exclude='tests' --exclude='storage/app/public' ./ "$DEPLOYPATH/"
    # rsync skips storage/app/public, and a fresh target has no storage/ or bootstrap/cache/,
    # so recreate every writable directory before artisan runs.
    - /bin/mkdir -p "$DEPLOYPATH/storage/app/public" "$DEPLOYPATH/storage/app/private" "$DEPLOYPATH/storage/framework/cache/data" "$DEPLOYPATH/storage/framework/sessions" "$DEPLOYPATH/storage/framework/views" "$DEPLOYPATH/storage/logs" "$DEPLOYPATH/bootstrap/cache"
    - /bin/chmod -R ug+rwX "$DEPLOYPATH/storage" "$DEPLOYPATH/bootstrap/cache"
    # First deploy only: .env must exist and already hold an APP_KEY, because the tasks below cache
    # the config. The deployment stops at this line if the file is missing.
    - echo "Deploying to $DEPLOYPATH"
    - test -f "$DEPLOYPATH/.env"
    - cd "$DEPLOYPATH" && $COMPOSER install --no-dev --optimize-autoloader --no-interaction
    - cd "$DEPLOYPATH" && $PHP artisan migrate --force
    - cd "$DEPLOYPATH" && $PHP artisan optimize:clear
    - cd "$DEPLOYPATH" && $PHP artisan config:cache
    - cd "$DEPLOYPATH" && $PHP artisan route:cache
    - cd "$DEPLOYPATH" && $PHP artisan view:cache
    - cd "$DEPLOYPATH" && $PHP artisan event:cache
    - cd "$DEPLOYPATH" && $PHP artisan storage:link || true
    - cd "$DEPLOYPATH" && $PHP artisan queue:restart || true
